[versions]
agp = "8.13.2"
kotlin = "2.4.10"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
composeBom = "2025.10.01"
serialization = "1.11.0"
coroutines = "1.9.0"
okhttp = "4.12.0"
commonsCompress = "1.27.1"
# Jetpack Security Crypto: EncryptedSharedPreferences for the single AEMET secret. 1.1.0-alpha06 is the
# terminal release (Google has since deprecated the library), so it is effectively pinned; it carries the
# modern MasterKey.Builder API and supports minSdk 26. See store/SecretStore.kt for the rationale.
securityCrypto = "1.1.0-alpha06"
# Jetpack DataStore (Preferences): the app's small key-value state (activeINE, favourites, use24h clock).
datastore = "1.1.7"
# AndroidX Lifecycle: the ViewModel + StateFlow the "Hoy" screen is exposed through, and the Compose
# lifecycle-aware state collection (collectAsStateWithLifecycle).
lifecycle = "2.9.4"
# Jetpack Glance: the Home Screen app widget. 1.1.1 is the current stable release and works on the pinned
# stack (compileSdk 36, AGP 8.13.2); it compiles @Composable widget content with the same Compose compiler
# plugin already applied, but renders to RemoteViews, not Compose. See widget/AuraGlanceWidget.kt.
glance = "1.1.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
